[workspace]
default-members = ["sercli"]
members = ["client", "model", "sercli", "server"]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.1"

[workspace.metadata.cargo-machete]
ignored = []

[workspace.dependencies]
Inflector = "0.11"
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from"] }
fake = "5.1"
home = "0.5"
log = "0.4"
pasetors = "0.7"
rand = "0.10"
rust_decimal = { version = "1.40", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlparser = "0.61"
sqlx = { version = "0.8", features = ["chrono", "postgres", "runtime-tokio-rustls", "rust_decimal"] }
strum = { version = "0.28", features = ["derive", "strum_macros"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "tracing"] }

netrun = "0.34.0"
reflected = { version = "0.30", features = ["random", "sqlx_bind"] }

generator = { path = "deps/generator" }

model = { path = "model" }
server = { path = "server" }


sercli = { path = "sercli" }
sercli_utils = { path = "deps/utils" }

[patch.crates-io]
#reflected = { path = "../reflected/reflected" }
